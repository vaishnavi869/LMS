image: gradle:8.7-jdk17

stages:
  - build
  - test
  - release

build_job:
  stage: build
  script:
    - gradle --no-daemon clean assemble

test_job:
  stage: test
  script:
    - gradle --no-daemon test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/*.xml

release_job:
  stage: release
  script:
    - echo "LMS application ready for release"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'